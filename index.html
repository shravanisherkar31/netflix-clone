<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>home page</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section class="main-hero-section"></section>
    <div class="hero-img">
      <img src="./images/netflix.png" alt="Netflix logo" />
    </div>
    <div>
      <div class="language-control">
        <img src="./images/language.png" alt="" class="language-icon" />
        <select class="language-select" id="language-select">
          <option value="en">English</option>
          <option value="hi">Hindi</option>
        </select>
      </div>
      <button class="sign-in-btn">Sign In</button>
    </div>

    <div class="hero-content">
      <p class="tagline">Unlimited movies,<br> shows, and more.</p>
      <h1 class="tagline-1">Starts at ₹149. cancel anytime.</h1><br>
        <h3 class="tagline-2">Ready to watch? Enter your email to create or restart your membership.</h3>
        <div class="email-signup">
          <input
            id="email-address"
            type="email"
            placeholder="Email address"
            aria-label="Email address"
          />
          <button  id="email-button" type="button">Get Started ❯</button>
        </div>
    </div>

    <section class="trending-section" aria-labelledby="trending-heading">
        <h1 id="trending-heading">Trending Now</h1>
   
           
            <div class="trending-row" role="region" aria-label="Trending titles" tabindex="0">
                <img src="./images/vishwanath&sons.jpeg" alt="Trending 1">
                <img src="./images/Nani.jpeg" alt="Trending 2">
                <img src="./images/Dorothy-Poster-225x300.jpeg" alt="Trending 3">
                <img src="./images/Irumudi-Movie-Review-Rating-in-English.jpg" alt="Trending 4">
                <img src="./images/dhamaal 4.jpeg" alt="Trending 5">
                <img src="./images/chumbak colony.jpeg" alt="Trending 6">
                <img src="./images/gajab raat.webp" alt="Trending 7">
                <img src="./images/kapil sharma show.jpeg" alt="Trending 8">
                <img src="./images/mandaai.jpg" alt="Trending 9">
                <img src="./images/modha rathri.jpeg" alt="Trending 10">
            </div>
          
  
    </section>


  </body>
</html>
